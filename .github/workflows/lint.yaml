name: lint

on:
pull_request:
push:

permissions:
contents: read

jobs:
lint:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v5

  - name: Setup Node.js
    uses: actions/setup-node@v6
    with:
      node-version: 22
      cache: npm

  - name: Install dependencies
    run: npm ci

  - name: Check formatting
    run: npm run format-check

  - name: Run ESLint
    run: npm run lint