sonar.projectKey=items-project
sonar.projectName=Items Project
sonar.projectVersion=1.0.1

sonar.sourceEncoding=UTF-8

# Source code
sonar.sources=.
sonar.exclusions=node_modules/**,dist/**,coverage/**,.git/**,package-lock.json,*.md,.env,.env.example,**/*.test.ts,**/*.spec.ts

# Test code
sonar.tests=.
